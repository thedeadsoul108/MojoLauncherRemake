name: MojoRemake CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read app version
        id: version
        run: |
          VERSION="$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "appVersion is missing from gradle.properties" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## MojoRemake v$VERSION"
            echo ""
            echo "- Build: #${{ github.run_number }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        if: github.repository_owner == 'MojoLauncher'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_mojo/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unit tests
        run: gradle :app_mojo:testFullDebugUnitTest

      - name: Create out directory
        run: mkdir out

      - name: Build Publishing .aab
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_mojo:bundleFullGplay
          mv app_mojo/build/outputs/bundle/fullGplay/app_mojo-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          gradle :app_mojo:assembleFullDebug
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk \
            "out/MojoRemake-v${{ steps.version.outputs.version }}-b${{ github.run_number }}-full-debug.apk"

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_mojo:assembleNoruntimeDebug
          mv app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk \
            "out/MojoRemake-v${{ steps.version.outputs.version }}-b${{ github.run_number }}-noruntime-debug.apk"

      - name: Build Nightly Release .apk
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_mojo:assembleFullPubRelease
          mv app_mojo/build/outputs/apk/full/pubRelease/app_mojo-full-pubRelease.apk \
            "out/MojoRemake-v${{ steps.version.outputs.version }}-full-release.apk"

      - name: Gen md5sums
        run: |
          for apk in out/*.apk; do
            md5sum "$apk" > "$apk.md5"
          done

      - name: Write build info
        run: |
          cat > out/build-info.txt <<EOF
          MojoRemake v${{ steps.version.outputs.version }}
          Build: #${{ github.run_number }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Workflow: ${{ github.workflow }}
          EOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MojoRemake-v${{ steps.version.outputs.version }}-b${{ github.run_number }}-full-debug
          path: out/*-full-debug.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: MojoRemake-v${{ steps.version.outputs.version }}-b${{ github.run_number }}-noruntime-debug
          path: out/*-noruntime-debug.apk

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: MojoRemake-v${{ steps.version.outputs.version }}-b${{ github.run_number }}-checksums
          path: out/*.md5

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: MojoRemake-v${{ steps.version.outputs.version }}-b${{ github.run_number }}-build-info
          path: out/build-info.txt

      - name: Release Nightly APK
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: MojoRemake Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            MojoRemake nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/MojoRemake-v${{ steps.version.outputs.version }}-full-release.apk

      - name: Upload AAB
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
